<h2>Suggested for <span id="suggest-town">{{ settings.get('town_name') or 'your town' }}</span></h2>
<p class="muted small busy" id="suggest-status">Checking which feeds work…</p>
<ul class="feedlist" id="suggest-list"></ul>
<p><button type="button" class="btn small" id="restore-defaults-btn">↺ Restore default feeds</button></p>
<ul class="feedlist" id="restore-list"></ul>

<script>
// Town currently selected in the Feeds card tiles ("all" when the
// grouped view is shown) — suggested feeds are computed for this town
// and added feeds are tagged with it.
const suggestTownSlug = {{ (pro_feed_filter if pro_enabled else 'all')|tojson }};
function suggestQuery() {
  // Pass the tile's slug explicitly so feeds follow the selected tile
  // even if the stored filter was reset.
  return (suggestTownSlug && suggestTownSlug !== 'all')
    ? '?town=' + encodeURIComponent(suggestTownSlug) : '';
}
// One suggested/restorable feed row with an Add button. Shared by the
// suggestions list and the "restore defaults" list.
function makeFeedLi(f) {
  const li = document.createElement('li');
  li.className = 'feed';
  const info = document.createElement('div');
  const strong = document.createElement('strong');
  strong.textContent = f.name;
  if (f.origin === 'web') {
    const pill = document.createElement('span');
    pill.className = 'pill';
    pill.textContent = 'found on the web';
    pill.title = 'Discovered by scanning the internet for this town';
    strong.appendChild(document.createTextNode(' '));
    strong.appendChild(pill);
  }
  const url = document.createElement('div');
  url.className = 'muted small';
  url.textContent = f.url;
  info.appendChild(strong);
  info.appendChild(url);
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'btn small';
  btn.textContent = 'Add';
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    const fd = new FormData();
    fd.append('name', f.name);
    fd.append('url', f.url);
    if (suggestTownSlug && suggestTownSlug !== 'all') {
      fd.append('town_slug', suggestTownSlug);
    }
    const resp = await fetch('{{ url_for("feed_add") }}', {
      method: 'POST',
      body: fd,
      headers: { 'X-Requested-With': 'fetch' }
    });
    let dup = false, existing = null, err = null;
    try { const j = await resp.json(); dup = j.duplicate === true; existing = j.existing || null; err = j.error || null; } catch (e) {}
    if (err && !dup) {
      btn.textContent = '✗ ' + err.slice(0, 60);
    } else if (dup && existing) {
      btn.textContent = '✓ Already in your feeds as “' + existing.name + '”' + (existing.town ? ' (' + existing.town + ')' : '');
    } else {
      btn.textContent = dup ? '✓ Already in your feeds' : '✓ Added — scanning now';
    }
  });
  li.appendChild(info);
  li.appendChild(btn);
  return li;
}
async function loadSuggestions() {
  const box = document.getElementById('suggest-list');
  const status = document.getElementById('suggest-status');
  box.innerHTML = '';
  status.classList.add('busy');
  status.textContent = 'Checking which feeds work…';
  try {
    const r = await fetch('{{ url_for("api_suggestions") }}' + suggestQuery());
    const data = await r.json();
    const items = data.suggestions || [];
    const townEl = document.getElementById('suggest-town');
    if (townEl && data.town) townEl.textContent = data.town;
    if (!items.length) {
      status.classList.remove('busy');
      status.textContent = data.town
        ? 'No new feeds found for ' + data.town + ' — the directory grows with each release.'
        : 'Set your town above to get feed suggestions.';
      return;
    }
    status.classList.remove('busy');
    status.textContent = items.length + ' suggestion(s) for ' + (data.town || 'your town') + ':';
    var near = document.getElementById('scan-near-status');
    if (near) near.classList.remove('busy');
    for (const f of items) {
      box.appendChild(makeFeedLi(f));
    }
  } catch (e) {
    status.classList.remove('busy');
    status.textContent = 'Could not check feeds right now — try again later.';
    var near2 = document.getElementById('scan-near-status');
    if (near2) near2.classList.remove('busy');
  }
}
// "Get the defaults back": lists the town's curated directory feeds
// that aren't added, so the user picks which ones to re-add.
document.getElementById('restore-defaults-btn').addEventListener('click', async () => {
  const box = document.getElementById('restore-list');
  const btn = document.getElementById('restore-defaults-btn');
  btn.disabled = true;
  btn.textContent = 'Loading…';
  box.innerHTML = '';
  try {
    const r = await fetch('{{ url_for("api_restore_defaults") }}' + suggestQuery());
    const data = await r.json();
    const items = data.defaults || [];
    if (!items.length) {
      btn.textContent = '✓ All default feeds already added';
      return;
    }
    btn.textContent = '↺ Restore default feeds';
    btn.disabled = false;
    for (const f of items) {
      box.appendChild(makeFeedLi(f));
    }
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '↺ Restore default feeds';
  }
});
document.addEventListener('DOMContentLoaded', loadSuggestions);
</script>
