{% extends "base.html" %}
{% block title %}Edit feed — TownsLine{% endblock %}
{% block content %}
<h1>Edit feed</h1>
<div class="card">
  <form method="post" id="feed-edit-form">
    <label>Name
      <input name="name" value="{{ feed['name']|e }}" placeholder="e.g. Airdrie Library">
    </label>
    <label>Feed URL
      <input name="url" type="url" value="{{ feed['url']|e }}" required>
    </label>
    {% if pro_enabled %}
    <label>Town
      <select name="town_slug">
        <option value="">— untagged (main town) —</option>
        {% for t in towns %}
        <option value="{{ t.town_slug }}"{% if (feed['town_slug'] or '') == t.town_slug %} selected{% endif %}>{{ t.town_name }}{% if t.is_main %} (main){% endif %}</option>
        {% endfor %}
      </select>
    </label>
    {% endif %}
    <label class="check">
      <input type="checkbox" name="enabled" value="1"{% if feed['enabled'] %} checked{% endif %}>
      Enabled
    </label>
    <div class="btnrow">
      <button type="submit">Save</button>
      <a class="btn ghost" href="{{ url_for('settings_page') }}#feeds">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
