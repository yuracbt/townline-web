{% extends "base.html" %}
{% block title %}Register — TownsLine{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Create your account</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Username <input name="username" autocomplete="username" required></label>
    <label>Email <input type="email" name="email" autocomplete="email" required></label>
    <label>Password <input type="password" name="password" autocomplete="new-password" required></label>
    <p class="muted small">Password needs at least 8 characters, one capital letter, one number and one special character.</p>
    <button type="submit">Register</button>
  </form>
  <p class="muted">Already have one? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
